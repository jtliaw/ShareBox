name: Build from zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir work
          unzip -q "$(ls *.zip | head -1)" -d work
          cd work
          if [ "$(ls | wc -l)" = 1 ] && [ -d "$(ls)" ]; then cd "$(ls)"; fi
          echo "SRC=$PWD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        run: cd "$SRC" && gradle assembleDebug
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$SRC"/app/build/outputs/apk/debug/*.apk \
            --title "Build ${{ github.run_number }}" --notes "auto build"
